name: redis (temp)
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: fire /run
        run: |
          curl -s -o /tmp/b.txt -w 'HTTP:%{http_code}\n' --max-time 200 \
            "https://daily-digest.gandli-digest.workers.dev/run?token=${{ secrets.DD_RUN_TOKEN_SECRET }}&cache=0"
          echo "body: $(head -c 150 /tmp/b.txt)"