name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 逃生门: GH 对未完成 PR CI 的 squash merge 会去重跳过 main push CI → 手动补部署

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: secret leak scan
        run: |
          ! grep -rEn "(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,})" src/ wrangler.jsonc
      - run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: dry-run-only
          CLOUDFLARE_ACCOUNT_ID: dry-run-only

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CF secrets 未配置时优雅跳过; 配置后自动生效
      - name: Deploy via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          npx wrangler deploy
      # 播种 search:index(单KV键, 文件系统库索引)——/search 依赖它, 失败不阻塞部署
      - name: Seed search index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          if [ ! -f data/library.jsonl ]; then echo "::notice::library.jsonl missing, skip seeding"; exit 0; fi
          node scripts/seed-search-index.mjs
          npx wrangler kv key put "search:index" --path=data/lib-index.json --namespace-id=51e73f8381d34b9c95eaebdf4f7d8101 --remote