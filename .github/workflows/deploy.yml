name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 逃生门: GH 对未完成 PR CI 的 squash merge 会去重跳过 main push CI → 手动补部署
    inputs:
      reseed_search:
        description: '强制重新播种 search:index(搜索同义词字典更新后使用)'
        required: false
        default: 'false'
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: secret leak scan
        run: |
          ! grep -rEn "(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,})" src/ wrangler.jsonc
      - run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: dry-run-only
          CLOUDFLARE_ACCOUNT_ID: dry-run-only

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CF secrets 未配置时优雅跳过; 配置后自动生效
      - name: Deploy via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          npx wrangler deploy
      # 播种 search:index(单KV键, 文件系统库索引)——/search 依赖它。
      # 幂等: KV 已存在该键即跳过(wrangler kv key get 退出码 0), 避免每次 deploy 消耗免费 puts 配额打爆 429。
      - name: Seed search index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NS: 51e73f8381d34b9c95eaebdf4f7d8101
          RESEED: ${{ github.event.inputs.reseed_search || 'false' }}
        run: |
          set +e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          if [ ! -f data/library.jsonl ]; then echo "::notice::library.jsonl missing, skip seeding"; exit 0; fi
          if [ "$RESEED" != "true" ]; then
            npx wrangler kv key get "search:index" --namespace-id=$KV_NS --remote >/dev/null 2>&1
            if [ $? -eq 0 ]; then echo "::notice::search:index already seeded, skip"; exit 0; fi
          fi
          node scripts/seed-search-index.mjs
          npx wrangler kv key put "search:index" --path=data/lib-index.json --namespace-id=$KV_NS --remote