name: Manual

# 用户手册自动重生成: e2e 场景 → 合成聊天截图(带标注) → AI 生成正文 → 提交 docs/guide/。
# Bot 行为一变(src/**), 手册即过期 → push main 自动重跑, 保证手册与功能永远同步。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: # 手动补跑(如 LLM 曾不可用走了模板兜底)

permissions:
  contents: write

concurrency:
  group: manual
  cancel-in-progress: true

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install CJK fonts (截图中文渲染)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run manual pipeline (场景 → 截图 → AI 正文)
        run: npm run manual
        env:
          # 缺失/失败自动走确定性模板兜底, 不会红
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Commit regenerated manual
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: 自动更新用户手册 [skip ci]'
          file_pattern: 'docs/guide/**'
