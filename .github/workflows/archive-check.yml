name: archive-check (temp)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /run and report
        run: |
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 180 \
            "https://daily-digest.gandli-digest.workers.dev/run?token=$DD_TOKEN&cache=0")
          echo "HTTP: $code"
          echo "body: $(head -c 200 /tmp/body.txt)"
        env:
          DD_TOKEN: ${{ vars.DD_RUN_TOKEN }}