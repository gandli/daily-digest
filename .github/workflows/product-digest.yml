name: product-digest

on:
  schedule:
    # 每天北京时间 08:30 (UTC 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [product-digest]

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      GENEDAI_API_KEY: ${{ secrets.GENEDAI_API_KEY }}
      GH_ARCHIVE_REPO: gandli/daily-digest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run product digest
        run: npx tsx scripts/product-digest.ts

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -H 'content-type: application/json' \
            -d "{\"chat_id\":\"${{ secrets.CHAT_ID }}\",\"text\":\"⚠️ product-digest Actions 失败: 见 https://github.com/gandli/daily-digest/actions\",\"parse_mode\":\"HTML\"}"
